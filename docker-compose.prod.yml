# Stack para Docker Swarm no VPS srv969720 (hospedando atrás do Traefik existente).
# Uso: docker stack deploy -c docker-compose.prod.yml hope_saude
#
# Pré-requisitos (executar UMA vez no VPS antes do primeiro deploy):
#   1. Criar diretório de dados:
#        sudo mkdir -p /opt/hope_saude/data
#   2. Criar /opt/hope_saude/api.env com todas as variáveis (baseado em apps/api/.env.example)
#   3. Garantir rede externa do Traefik:
#        docker network inspect traefik-public || docker network create --driver overlay traefik-public
#   4. Apontar DNS: api.hope.srv969720.hstgr.cloud + app.hope.srv969720.hstgr.cloud
#
# NOTA: env_file abaixo referencia um path absoluto que existe APENAS no VPS.
# `docker compose config` local vai falhar — isso é esperado. Use só em produção.
services:
  api:
    image: hope-saude/api:latest
    env_file:
      - /opt/hope_saude/api.env
    volumes:
      - /opt/hope_saude/data:/app/prisma
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.hope-api.rule=Host(`api.hope.srv969720.hstgr.cloud`)"
        - "traefik.http.routers.hope-api.entrypoints=websecure"
        - "traefik.http.routers.hope-api.tls.certresolver=letsencrypt"
        - "traefik.http.services.hope-api.loadbalancer.server.port=3000"

  web:
    image: hope-saude/web:latest
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=https://api.hope.srv969720.hstgr.cloud
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.hope-web.rule=Host(`app.hope.srv969720.hstgr.cloud`)"
        - "traefik.http.routers.hope-web.entrypoints=websecure"
        - "traefik.http.routers.hope-web.tls.certresolver=letsencrypt"
        - "traefik.http.services.hope-web.loadbalancer.server.port=3001"

  litestream:
    image: litestream/litestream:0.3
    command: ["replicate", "-config", "/etc/litestream.yml"]
    env_file:
      - /opt/hope_saude/api.env
    volumes:
      - /opt/hope_saude/data:/data:ro
      - /opt/hope_saude/litestream.yml:/etc/litestream.yml:ro
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    external: true
