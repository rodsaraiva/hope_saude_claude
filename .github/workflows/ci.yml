name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: apps/api
        env:
          DATABASE_URL: 'file:./test.db'

      - name: Typecheck API
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/api

      - name: Lint API
        run: npx eslint "apps/api/src/**/*.ts"

      - name: Run API tests
        run: npm test
        working-directory: apps/api
        env:
          DATABASE_URL: 'file:./test.db'
          JWT_SECRET: 'ci-test-secret-not-for-production'
          DATA_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint web
        run: npx eslint "apps/web/src/**/*.{ts,tsx}"

      - name: Build web (typecheck + build)
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: 'http://localhost:3000'

      - name: Run web tests
        run: npx jest
        working-directory: apps/web

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Falha apenas em vulnerabilidades critical (high/moderate ainda passam
      # enquanto não migramos devDeps transitivos — ver sprint 4)
      - name: Run npm audit (production deps only)
        run: npm audit --omit=dev --audit-level=critical
